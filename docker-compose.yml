# VidKeep Docker Compose Configuration
# NOTE: Default credentials are for local development only.
#       For production, use environment variables or Docker secrets.

services:
  # T026: Unified monolith service (frontend + backend + embedded workers)
  app:
    build: . # Uses root Dockerfile
    ports:
      - "3001:8000" # Serve on 3001 (same as old frontend)
    volumes:
      - vidkeep_data:/data
    environment:
      DATABASE_URL: postgresql+asyncpg://vidkeep:vidkeep@postgres:5432/vidkeep
      REDIS_URL: redis://redis:6379
      DATA_PATH: /data
      MAX_VIDEO_HEIGHT: 1080
      # Embedded worker config (T028)
      MAX_WORKERS: 2
      POD_NAME: local-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # NOTE: Frontend service removed - now served by app (T026)
  # NOTE: Worker service removed - embedded in app (T028)

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: vidkeep
      POSTGRES_PASSWORD: vidkeep
      POSTGRES_DB: vidkeep
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vidkeep -d vidkeep" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vidkeep_data:
  postgres_data:
